<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yugi Jo: Channel Strategy Report</title>
<meta name="description" content="What 32 long-form videos, live audience data and low-competition search demand say to film next. Live streams, Shorts, and anything before 21 March 2025 excluded.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* build stamp: premium / dark / triadic / seed-default / 10 text-safe, 4 UI-safe, 7 decorative */
/* Color contract from check_contrast.py --matrix. primary is UI-safe only (4.20 vs bg): it fills
   bars and rules, never text. Emphasised text and numerals use accent (6.90 vs bg). */
:root{
  --text:#eff1fe;  --bg:#0a0a10;  --surface:#14151b;  --primary:#6368d5;
  --on-primary:#ffffff; --secondary:#272a4a; --accent:#f1744d;  --border:#202127;

  /* spacing scale, one set reused throughout */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --s7:48px; --s8:64px; --s9:96px; --s10:128px;

  --r:6px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050508;overflow:hidden;color:var(--text);
  font-family:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

.slide{width:1920px;height:1080px;background:var(--bg);position:absolute;top:50%;left:50%;
  transform-origin:center;padding:var(--s9) var(--s10);display:none;flex-direction:column}
.slide.active{display:flex}

.kicker{font-size:20px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  color:var(--accent);margin-bottom:var(--s6)}
h1{font-family:Unbounded,sans-serif;font-weight:800;font-size:150px;line-height:1;
  letter-spacing:-.03em}
h2{font-family:Unbounded,sans-serif;font-weight:600;font-size:66px;line-height:1.1;
  letter-spacing:-.025em;max-width:1560px}
.lede{font-size:30px;line-height:1.5;opacity:.88;max-width:1240px}
.small{font-size:21px;line-height:1.5;opacity:.62}
.foot{position:absolute;bottom:var(--s6);left:var(--s10);right:var(--s10);
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:18px;letter-spacing:.06em;opacity:.42}
.foot .n{font-variant-numeric:tabular-nums;font-weight:600}

/* reveal motion: scene change plus staggered content, reduced-motion aware */
.r{opacity:0;transform:translateY(16px);
  transition:opacity 560ms var(--ease),transform 560ms var(--ease)}
.slide.active .r{opacity:1;transform:none}
.slide.active .r:nth-child(1){transition-delay:60ms}
.slide.active .r:nth-child(2){transition-delay:140ms}
.slide.active .r:nth-child(3){transition-delay:220ms}
.slide.active .r:nth-child(4){transition-delay:300ms}
.slide.active .r:nth-child(5){transition-delay:380ms}

.cover{justify-content:center}
.cover .lede{font-size:34px;max-width:1040px}
.strip{display:flex;gap:var(--s8);margin-top:var(--s8);padding-top:var(--s6);
  border-top:1px solid var(--border)}
.strip .v{font-size:52px;line-height:1;font-family:Unbounded,sans-serif;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--accent)}
.strip .l{font-size:17px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-top:var(--s3)}

.statement{justify-content:center}
.statement h2{font-size:90px;max-width:1580px}
.rule{width:140px;height:5px;background:var(--accent);margin-top:var(--s7)}
.statement .lede{margin-top:var(--s7);font-size:29px;max-width:1300px}

.chart{flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:var(--s5)}
.row{display:grid;grid-template-columns:430px 1fr 165px;align-items:center;
  gap:var(--s5);margin-bottom:var(--s4)}
.row .k{font-size:23px;text-align:right;opacity:.9;line-height:1.25}
.row .v{font-size:23px;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:36px;background:var(--surface);border-radius:3px;position:relative}
.fill{height:100%;background:var(--primary);border-radius:3px}
.fill.hot{background:var(--accent)}
.row.hot .v{color:var(--accent)}
.track{position:relative}
.thresh{position:absolute;top:-7px;bottom:-7px;width:1px;background:var(--accent)}
.thresh span{position:absolute;top:-28px;left:0;font-size:15px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);white-space:nowrap}

.cols{display:flex;align-items:flex-end;gap:var(--s8);height:480px;margin-top:var(--s7);
  border-bottom:1px solid var(--border)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.col .cv{font-size:32px;font-variant-numeric:tabular-nums;font-family:Unbounded,sans-serif;
  font-weight:600;margin-bottom:var(--s3)}
.col .cb{width:100%;background:var(--primary);border-radius:3px 3px 0 0}
.col.crit .cb{background:var(--accent)}
.col.crit .cv{color:var(--accent)}
.col .cl{font-size:20px;opacity:.7;margin-top:var(--s4);text-align:center}
.col .cl b{display:block;font-size:16px;font-weight:400;opacity:.72;margin-top:4px;
  font-variant-numeric:tabular-nums}

/* length rows: duration | what it is | scale | views */
.lrow{display:grid;grid-template-columns:126px 452px 1fr 150px;align-items:center;
  gap:var(--s5);margin-bottom:var(--s4)}
.lrow .len{font-family:Unbounded,sans-serif;font-weight:600;font-size:25px;
  font-variant-numeric:tabular-nums;text-align:right;color:var(--accent)}
.lrow .k{font-size:21px;line-height:1.25}
.lrow .k span{display:block;font-size:17px;opacity:.55;margin-top:3px}
.lrow .v{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}

table{width:100%;border-collapse:collapse;margin-top:var(--s5)}
th{font-size:17px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;text-align:left;
  padding:0 var(--s4) var(--s3) 0;border-bottom:1px solid var(--border);font-weight:600}
td{font-size:23px;padding:var(--s4) var(--s4) var(--s4) 0;border-bottom:1px solid var(--border);
  font-variant-numeric:tabular-nums}
td.k{font-weight:600;font-variant-numeric:normal}
td.win{color:var(--accent);font-weight:700}
td.bad{opacity:.72;font-weight:600}
tr.hi td{background:var(--surface)}
td small{display:block;font-size:17px;opacity:.55;margin-top:3px;font-weight:400;
  font-variant-numeric:normal}

/* ranked split list: shows a bimodal category as one descending run with a break in it */
.arow{display:grid;grid-template-columns:110px 1fr 118px;align-items:center;
  gap:var(--s5);padding:7px 0}
.arow .p{font-family:Unbounded,sans-serif;font-weight:600;font-size:22px;
  font-variant-numeric:tabular-nums;text-align:right;color:var(--accent)}
.arow.dim .p{color:var(--text);opacity:.45;font-weight:400}
.arow .t{font-size:21px;line-height:1.2}
.arow .m{font-size:19px;text-align:right;opacity:.68;font-variant-numeric:tabular-nums}
.agap{display:flex;align-items:center;gap:var(--s4);margin:10px 0}
.agap hr{flex:1;border:none;border-top:1px solid var(--accent);margin:0}
.agap em{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  font-style:normal;white-space:nowrap}

.callout{margin-top:auto;background:var(--surface);border-left:3px solid var(--accent);
  padding:var(--s6);display:flex;gap:var(--s6);align-items:center;border-radius:0 var(--r) var(--r) 0}
.callout .big{font-family:Unbounded,sans-serif;font-weight:800;font-size:42px;line-height:1.05;
  color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.callout .t{font-size:25px;line-height:1.42;opacity:.9}

.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--s8);margin-top:var(--s6);flex:1}
.panel{border-top:2px solid var(--border);padding-top:var(--s5)}
.panel.yes{border-top-color:var(--accent)}
.panel .tag{font-size:18px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  opacity:.55;margin-bottom:var(--s5)}
.panel.yes .tag{color:var(--accent);opacity:1}
.panel ul{list-style:none}
.panel li{font-size:25px;line-height:1.4;padding-bottom:var(--s5);opacity:.92}
.panel li b{font-weight:700}
.panel li span{display:block;font-size:19px;opacity:.58;margin-top:var(--s2)}

#progresswrap{position:fixed;left:0;bottom:0;height:3px;width:100%;overflow:hidden;z-index:100}
#progress{height:3px;width:100%;background:var(--accent);transform:translateX(-100%);
  transition:transform 260ms var(--ease)}
#hint{position:fixed;right:18px;bottom:14px;font-size:13px;letter-spacing:.12em;opacity:.3;
  z-index:100;font-family:ui-monospace,monospace}

@media (prefers-reduced-motion: reduce){
  .r{opacity:1;transform:none;transition:none}
  #progress{transition:none}
}
@media print{
  html,body{overflow:visible;background:#fff;height:auto}
  #stage{position:static;display:block}
  .slide{display:flex!important;position:relative;top:auto;left:auto;transform:none!important;
    page-break-after:always;margin:0}
  .r{opacity:1!important;transform:none!important}
  #progresswrap,#progress,#hint{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="progresswrap"><div id="progress"></div></div>

<script>

const stage = document.getElementById('stage');
SLIDES.forEach((html, i) => {
  const wrap = document.createElement('div');
  wrap.innerHTML = html.trim();
  const el = wrap.firstElementChild;
  if (!el.querySelector('.foot')) {
    const f = document.createElement('div');
    f.className = 'foot';
    f.innerHTML = '<span>Yugi Jo channel strategy report, 20 November 2026</span>' +
                  '<span class="n">' + String(i + 1).padStart(2, '0') + ' / ' +
                  String(SLIDES.length).padStart(2, '0') + '</span>';
    el.appendChild(f);
  }
  stage.appendChild(el);
});
const els = [...stage.querySelectorAll('.slide')];
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

let cur = Math.min(parseInt(localStorage.getItem('yjdeck') || '0', 10) || 0, els.length - 1);
function show(i) {
  cur = Math.max(0, Math.min(els.length - 1, i));
  els.forEach((e, n) => e.classList.toggle('active', n === cur));
  localStorage.setItem('yjdeck', cur);
  document.getElementById('progress').style.transform = 'translateX(' + (-100 + (cur + 1) / els.length * 100) + '%)';
}
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  els.forEach(e => e.style.transform = 'translate(-50%,-50%) scale(' + s + ')');
}
addEventListener('resize', fit);
addEventListener('keydown', e => {
  if (['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(els.length - 1);
});
addEventListener('click', e => show(e.clientX < innerWidth * 0.25 ? cur - 1 : cur + 1));
fit(); show(cur);
</script>
